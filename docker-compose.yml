services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: saipr
      POSTGRES_PASSWORD: saipr
      POSTGRES_DB: saipr
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U saipr"]
      interval: 5s
      retries: 10

  api:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://saipr:saipr@db:5432/saipr
      SECRET_KEY: ${SECRET_KEY:-compose-dev-only-change-me}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

volumes:
  pgdata:
