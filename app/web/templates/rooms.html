{% extends "base.html" %}
{% block title %}읽기방{% endblock %}
{% block content %}
<div class="col" style="gap:3px"><span class="cap muted">같은 책을 각자의 속도로</span><h1 style="font-size:34px">읽기방</h1></div>
{% for c in rooms %}{% include "_room_card.html" %}{% else %}
<div class="glass card compact"><span class="cap">아직 들어간 방이 없어요. 책 화면에서 방을 만들 수 있어요.</span></div>
{% endfor %}
<form method="post" action="/rooms/join" class="glass card compact form">
  <input type="hidden" name="csrf_token" value="{{ csrf }}">
  <strong>초대 링크로 들어가기</strong>
  <div class="row" style="gap:8px"><div class="glass pill field" style="flex:1"><input name="link" required placeholder="링크나 8자리 코드" aria-label="초대 링크"></div><button class="solid btn">입장</button></div>
</form>
{% endblock %}
