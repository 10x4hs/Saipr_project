{% extends "base.html" %}
{% from "_ui.html" import icon %}
{% block title %}{{ book.title }} — 함께읽기{% endblock %}
{% block body_class %}reading{% endblock %}
{% block body %}
<header class="r-top glass">
  <a href="/library" class="pill-btn" aria-label="서재로">{{ icon('back') }}</a>
  <div class="r-title"><b>{{ book.title }}</b><span>{{ book.author or '' }}</span></div>
  <button class="pill-btn" id="aa" aria-label="보기 설정" aria-expanded="false">Aa</button>
</header>
<div class="r-sheet glass" id="sheet" hidden>
  <div class="r-row"><span>글자 크기</span><div class="seg mini"><button id="smaller" aria-label="작게">가−</button><button id="bigger" aria-label="크게">가+</button></div></div>
  <div class="r-row"><span>종이</span><div class="seg mini" id="tones"><button data-tone="">기본</button><button data-tone="paper">종이</button><button data-tone="night">밤</button></div></div>
</div>

<main class="r-stage" id="stage" data-book="{{ book.id }}" data-total="{{ book.total_chunks }}"
      data-start="{{ entry.current_chunk }}" data-verified="{{ entry.verified_chunk }}" data-csrf="{{ csrf }}"></main>
<div class="pg measure" id="measure" aria-hidden="true"></div>

<footer class="r-foot glass">
  <span class="mono" id="pos">–</span>
  <span class="dwell" title="이 쪽을 다 읽었다고 인정되기까지"><i id="dwell"></i></span>
  <span id="state">읽는 중</span>
</footer>
<script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>
<script src="/static/reader.js"></script>
{% endblock %}
