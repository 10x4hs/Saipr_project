<ol class="shelf">
  {% for b in items %}
  <li data-q="{{ b.title }} {{ b.author or '' }}">
    <a class="book" href="/open/{{ b.source }}/{{ b.id|urlencode }}">
      <span class="no mono">{{ '%02d' % loop.index if loop.index < 100 else loop.index }}</span>
      <span class="t">{{ b.title }}</span>
      <span class="a">{{ b.author or '' }}</span>
      <span class="y mono">{{ b.year or '' }}</span>
    </a>
  </li>
  {% endfor %}
</ol>
