{% extends "base.html" %}
{% from "_ui.html" import brand %}
{% block body_class %}auth{% endblock %}
{% block body %}
<div class="auth-bg" aria-hidden="true"><i class="auth-glass"></i><i class="auth-glow"></i></div>
<a class="auth-brand" href="/">{{ brand() }}</a>
<main class="auth-main">
  <div class="auth-card">
    {% block form %}{% endblock %}
  </div>
</main>
<footer class="auth-foot">{% block foot %}{% endblock %}</footer>
<script src="/static/auth.js"></script>
{% endblock %}
